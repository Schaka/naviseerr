name: Tagging Image

on:
  push:
    paths:
      - tagging-service/**
      - .github/workflows/tagging-image.yml
    tags:
      - '**'
    branches:
      - 'main'

  pull_request:
    paths:
      - tagging-service/**
    branches:
      - '**'

jobs:

  build-tagging-amd64:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub to pull images without rate limit
        continue-on-error: true
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Log into GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Force lower case for repository owner
        id: lc_owner
        run: |
          echo "owner_lc=${OWNER,,}" >> $GITHUB_OUTPUT
        env:
          OWNER: ${{ github.repository_owner }}

      - name: Determine Tag Name
        id: tag_name
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            NAME="${{ github.event.number }}-merge"
          else
            NAME="${{ github.ref_name }}"
          fi
          CLEAN_NAME=$(echo $NAME | sed 's/\//-/g')
          echo "value=$CLEAN_NAME" >> $GITHUB_OUTPUT

      - name: Build and push amd64 image
        uses: docker/build-push-action@v6
        with:
          context: tagging-service
          push: true
          build-args: |
            TARGETARCH=amd64
          tags: |
            ghcr.io/${{ steps.lc_owner.outputs.owner_lc }}/naviseerr-tagging:amd64-${{ steps.tag_name.outputs.value }}

  build-tagging-arm64:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub to pull images without rate limit
        continue-on-error: true
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Log into GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Force lower case for repository owner
        id: lc_owner
        run: |
          echo "owner_lc=${OWNER,,}" >> $GITHUB_OUTPUT
        env:
          OWNER: ${{ github.repository_owner }}

      - name: Determine Tag Name
        id: tag_name
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            NAME="${{ github.event.number }}-merge"
          else
            NAME="${{ github.ref_name }}"
          fi
          CLEAN_NAME=$(echo $NAME | sed 's/\//-/g')
          echo "value=$CLEAN_NAME" >> $GITHUB_OUTPUT

      - name: Build and push arm64 image
        uses: docker/build-push-action@v6
        with:
          context: tagging-service
          push: true
          build-args: |
            TARGETARCH=arm64
          tags: |
            ghcr.io/${{ steps.lc_owner.outputs.owner_lc }}/naviseerr-tagging:arm64-${{ steps.tag_name.outputs.value }}

  combine-images:
    runs-on: ubuntu-latest
    needs: [ build-tagging-amd64, build-tagging-arm64 ]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Log into GitHub Container Registry
        uses: docker/login-action@v3
        continue-on-error: true
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine Tag Name
        id: tag_name
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            NAME="${{ github.event.number }}-merge"
          else
            NAME="${{ github.ref_name }}"
          fi
          CLEAN_NAME=$(echo $NAME | sed 's/\//-/g')
          echo "value=$CLEAN_NAME" >> $GITHUB_OUTPUT

      - name: Force lower case for repository owner
        id: lc_owner
        run: |
          echo "owner_lc=${OWNER,,}" >> $GITHUB_OUTPUT
        env:
          OWNER: ${{ github.repository_owner }}

      - name: Combine tagging images into single manifest
        uses: int128/docker-manifest-create-action@v2
        with:
          push: true
          tags: |
            ghcr.io/${{ steps.lc_owner.outputs.owner_lc }}/naviseerr-tagging:${{ steps.tag_name.outputs.value }}
            ${{ (startsWith(github.ref, 'refs/tags/v') && format('ghcr.io/{0}/naviseerr-tagging:stable', steps.lc_owner.outputs.owner_lc)) || '' }}
          sources: |
            ghcr.io/${{ steps.lc_owner.outputs.owner_lc }}/naviseerr-tagging:amd64-${{ steps.tag_name.outputs.value }}
            ghcr.io/${{ steps.lc_owner.outputs.owner_lc }}/naviseerr-tagging:arm64-${{ steps.tag_name.outputs.value }}
